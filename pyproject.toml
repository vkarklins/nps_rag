[project]
name = "rag-nps"
version = "0.1.0"
description = ""
authors = [
    {name = "Varis Karklins",email = "vkarklins@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "openai (>=3.16.2,<4.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]

[tool.poetry]
packages = [{include = "rag_nps", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
